<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>병원 홈페이지</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background: #005f73; color: white; padding: 2rem 1rem; text-align: center; }
    nav a { color: white; margin: 0 1rem; text-decoration: none; }
    .hero { background: url('images/surgeon-hero.jpg') center/cover no-repeat; color: white; min-height: 60vh; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 10px rgba(0,0,0,0.7); }
    .hero h1 { font-size: 3rem; margin: 0; }
    .content { padding: 2rem 1rem; max-width: 1000px; margin: auto; }
    .cards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; }
    footer { background: #001219; color: #ddd; text-align: center; padding: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>우리 병원</h1>
    <nav>
      <a href="index.html">홈</a>
      <a href="philosophy.html">병원 철학</a>
      <a href="cooperation.html">협력 병원</a>
    </nav>
  </header>
  <section class="hero">
    <div>
      <h1>안전과 신뢰의 의료 서비스</h1>
      <p>최신 의료 기술과 환자 중심 케어를 제공합니다.</p>
    </div>
  </section>
  <main class="content">
    <section>
      <h2>환자를 먼저 생각합니다</h2>
      <p>우리 병원은 환자의 건강과 삶의 질을 최우선으로 하며, 전문 의료진이 최선의 진료를 제공합니다.</p>
    </section>
    <section class="cards">
      <div class="card">
        <h3>전문 의료진</h3>
        <p>각 분야 전문의가 협진 체계를 통해 안전한 치료를 지원합니다.</p>
      </div>
      <div class="card">
        <h3>첨단 의료 장비</h3>
        <p>최신 의료 장비를 바탕으로 정밀 검사와 치료가 가능합니다.</p>
      </div>
      <div class="card">
        <h3>환자 중심 케어</h3>
        <p>개개인에 맞춘 맞춤형 진료로 빠른 회복을 도와드립니다.</p>
      </div>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 우리 병원. 건강한 내일을 함께합니다.</p>
  </footer>
</body>
</html>
