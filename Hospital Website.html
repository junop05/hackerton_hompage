<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>서해한결의료원 — 화상·외상 전문 응급의료</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { overflow-x: hidden; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #F8F9FA;
    color: #191C1D;
  }

  img { max-width: 100%; }

  button { outline: none; font-family: inherit; }
  input, textarea, select { font-family: inherit; }

  @keyframes hPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.85); }
  }

  @keyframes hFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .h-page-enter {
    animation: hFadeIn 0.22s ease-out forwards;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #C4C6CE; border-radius: 3px; }

  /* Default: hide hamburger and mobile drawer entirely (desktop) */
  .h-nav-hamburger,
  .h-mobile-drawer,
  .h-mobile-drawer-overlay {
    display: none !important;
  }

  /* ============================================================
     Mobile optimization (iPhone / Galaxy)
     ============================================================ */
  @media (max-width: 1024px) {
    /* Tablet: keep desktop layout but tighten paddings */
    section[style*="padding: 80px 32px"],
    section[style*="padding: 60px 32px"],
    section[style*="padding: 64px 32px"],
    section[style*="padding: 56px 32px"],
    section[style*="padding: 48px 32px"],
    section[style*="padding: 40px 32px"] {
      padding-left: 24px !important;
      padding-right: 24px !important;
    }
  }

  @media (max-width: 768px) {
    /* ─── Hero (home) ─── */
    .hero-left-content { width: 100% !important; padding: 0 16px !important; }
    .hero-right-image { display: none !important; }
    .h-home-hero { height: auto !important; min-height: 0 !important; padding: 32px 0 40px !important; }
    .h-home-hero h1 { font-size: 34px !important; }

    /* ─── Top fixed bars ─── */
    .h-emergency-banner {
      height: 44px !important;
      padding: 0 12px !important;
      font-size: 11px !important;
      gap: 8px !important;
      white-space: nowrap !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch !important;
      justify-content: flex-start !important;
    }
    .h-emergency-banner > * { flex-shrink: 0 !important; }
    .h-emergency-banner .h-eb-sep { display: none !important; }
    .h-emergency-banner .h-eb-link {
      font-size: 11px !important;
      padding: 0 !important;
    }

    .h-nav { height: 56px !important; top: 44px !important; }
    .h-nav-inner { padding: 0 16px !important; }
    .h-nav-logo-title { font-size: 16px !important; }
    .h-nav-logo-sub { font-size: 9px !important; }
    .h-nav-desktop { display: none !important; }
    .h-nav-right-desktop { display: none !important; }
    .h-nav-hamburger {
      display: flex !important;
      background: none !important;
      border: none !important;
      cursor: pointer !important;
      width: 40px !important;
      height: 40px !important;
      align-items: center !important;
      justify-content: center !important;
      flex-direction: column !important;
      gap: 5px !important;
      padding: 0 !important;
    }
    .h-nav-emergency-btn { display: none !important; }

    /* Mobile drawer (positioned and visible) */
    .h-mobile-drawer {
      display: block !important;
      position: fixed !important;
      top: 100px !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      background: #fff !important;
      z-index: 998 !important;
      overflow-y: auto !important;
      transform: translateX(100%);
      transition: transform 0.25s ease-out;
    }
    .h-mobile-drawer.open { transform: translateX(0); }
    .h-mobile-drawer-overlay {
      display: block !important;
      position: fixed !important;
      top: 100px !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      background: rgba(0,0,0,0.4);
      z-index: 997 !important;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-out;
    }
    .h-mobile-drawer-overlay.open { opacity: 1; pointer-events: auto; }

    /* main padding-top = banner(44) + nav(56) on mobile */
    .h-main { padding-top: 100px !important; }

    /* ─── PageHero ─── */
    .h-page-hero { padding: 36px 16px 32px !important; }
    .h-page-hero h1 { font-size: 24px !important; line-height: 1.25 !important; }
    .h-page-hero p { font-size: 13px !important; line-height: 1.6 !important; }
    .h-page-hero-breadcrumb { font-size: 11px !important; flex-wrap: wrap !important; }

    /* ─── SectionTitle ─── */
    .h-section-title h2 { font-size: 22px !important; line-height: 1.3 !important; }
    .h-section-title p { font-size: 13px !important; }

    /* ─── Footer ─── */
    .h-footer { padding: 40px 16px 24px !important; }
    .h-footer-grid {
      grid-template-columns: 1fr !important;
      gap: 28px !important;
      margin-bottom: 28px !important;세분 -> 분과 교체
    }
    .h-footer-bottom {
      flex-direction: column !important;
      gap: 14px !important;
      align-items: flex-start !important;
    }
    .h-footer-bottom > p { font-size: 10px !important; line-height: 1.6 !important; }

    /* ─── Generic section padding ─── */
    section[style*="padding: 80px 32px"] { padding: 48px 16px !important; }
    section[style*="padding: 60px 32px"] { padding: 40px 16px !important; }
    section[style*="padding: 60px 32px 80px"] { padding: 40px 16px 48px !important; }
    section[style*="padding: 64px 32px"] { padding: 44px 16px !important; }
    section[style*="padding: 56px 32px 52px"] { padding: 36px 16px 32px !important; }
    section[style*="padding: 48px 32px"] { padding: 36px 16px !important; }
    section[style*="padding: 40px 32px"] { padding: 32px 16px !important; }

    div[style*="padding: 0 32px"] { padding-left: 16px !important; padding-right: 16px !important; }

    /* ─── Grids ─── */
    div[style*="grid-template-columns: repeat(4, 1fr)"] {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 12px !important;
    }
    div[style*="grid-template-columns: repeat(3, 1fr)"] {
      grid-template-columns: 1fr !important;
    }
    div[style*="grid-template-columns: repeat(2, 1fr)"],
    div[style*="grid-template-columns: 1fr 1fr"] {
      grid-template-columns: 1fr !important;
    }
    /* Keep 7-col calendar */
    div[style*="grid-template-columns: repeat(7, 1fr)"] {
      grid-template-columns: repeat(7, 1fr) !important;
    }
    /* Within 7-col calendar, day buttons */
    div[style*="grid-template-columns: repeat(7, 1fr)"] button {
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 1 !important;
      min-height: 32px !important;
    }

    /* ─── Home ER status strip — 2-column grid (no scroll) ─── */
    .h-er-strip {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 8px !important;
      height: auto !important;
      padding: 14px 0 !important;
      overflow-x: visible !important;
      align-items: stretch !important;
    }
    .h-er-strip > div:first-child,
    .h-er-strip > div:last-child {
      display: none !important;
    }
    .h-er-strip > div {
      padding: 10px 12px !important;
      border-right: none !important;
      margin-right: 0 !important;
      background: rgba(255,255,255,0.04) !important;
      border-radius: 6px !important;
    }

    /* Staff grid: 1-column on mobile to prevent name/status wrapping */
    div.h-staff-grid {
      grid-template-columns: 1fr !important;
      gap: 10px !important;
    }

    /* ─── Home stats row ─── */
    .h-hero-stats { flex-wrap: wrap !important; }
    .h-hero-stats > div { flex: 1 0 50% !important; border-bottom: 1px solid rgba(255,255,255,0.1) !important; }

    /* ─── Phone CTA ─── */
    .h-phone-cta { font-size: 28px !important; }

    /* ─── HBOT hero (50/50 split) ─── */
    .h-hbot-hero { height: auto !important; padding: 32px 0 !important; }
    .h-hbot-hero > div > div { width: 100% !important; }
    .h-hbot-hero .h-hbot-hero-img { display: none !important; }

    /* ─── Director photo (philosophy) ─── */
    .director-photo { max-width: 320px !important; margin: 0 auto !important; aspect-ratio: 3/4 !important; }

    /* ─── Appointment step indicator ─── */
    .h-appt-steps span { font-size: 10px !important; }

    /* ─── Buttons & font tweaks ─── */
    h1 { font-size: 26px !important; }
    h2 { line-height: 1.3 !important; }

    /* ─── Care process selector buttons ─── */
    .h-care-process-tabs {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 8px !important;
    }

    /* Cooperation page partner grid */
    .h-coop-overview { grid-template-columns: 1fr !important; gap: 16px !important; }
    .h-coop-steps { grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; }
    .h-coop-steps .h-coop-step-arrow { display: none !important; }

    /* Tabs become scrollable */
    .h-burn-tabs { overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; }
    .h-burn-tabs button { white-space: nowrap !important; }

    /* Filter tabs */
    .h-filter-tabs { overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; flex-wrap: nowrap !important; }
    .h-filter-tabs button { flex-shrink: 0 !important; white-space: nowrap !important; }

    /* Appointment summary row */
    .h-appt-summary { flex-direction: column !important; gap: 10px !important; }
    .h-appt-confirm-info { flex-direction: column !important; gap: 20px !important; padding: 20px 24px !important; }
  }

  /* Very small phones */
  @media (max-width: 380px) {
    .h-home-hero h1 { font-size: 28px !important; }
    .h-page-hero h1 { font-size: 22px !important; }
    .h-section-title h2 { font-size: 20px !important; }
    .h-phone-cta { font-size: 24px !important; }
    div[style*="grid-template-columns: repeat(4, 1fr)"] {
      grid-template-columns: 1fr !important;
    }
  }

</style>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="hospital-components.jsx"></script>
<script type="text/babel" src="hospital-pages-a.jsx"></script>
<script type="text/babel" src="hospital-pages-b.jsx"></script>
<script type="text/babel" src="hospital-pages-c.jsx"></script>
<script type="text/babel" src="hospital-pages-d.jsx"></script>
<script type="text/babel" src="hospital-pages-e.jsx"></script>
<script type="text/babel" src="hospital-pages-f.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "B",
  "erMode": "normal"
}/*EDITMODE-END*/;

// ── Main App ──────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState('home');
  const [lang, setLang] = useState('ko');
  const [visible, setVisible] = useState(true);

  const navigate = (newPage) => {
    if (newPage === page) return;
    setVisible(false);
    setTimeout(() => {
      setPage(newPage);
      window.scrollTo({ top: 0, behavior: 'instant' });
      setVisible(true);
    }, 140);
  };

  const theme = tweaks.theme || 'A';

  const pageProps = { onNavigate: navigate, theme };

  const pageMap = {
    'home':          <HomePage          {...pageProps} />,
    'er-status':     <ERStatusPage      {...pageProps} />,
    'appointment':   <AppointmentPage   {...pageProps} />,
    'medical-team':  <MedicalTeamPage   {...pageProps} />,
    'burn-treatment':<BurnTreatmentPage {...pageProps} />,
    'hbot':          <HBOTPage          {...pageProps} />,
    'equipment':     <EquipmentPage     {...pageProps} />,
    'workers-comp':  <WorkersCompPage   {...pageProps} />,
    'cooperation':   <MedicalCooperationPage {...pageProps} />,
    'care-process':  <CareProcessPage   {...pageProps} />,
    'philosophy':    <PhilosophyPage    {...pageProps} />,
    'directions':    <DirectionsPage    {...pageProps} />,
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <EmergencyBanner onNavigate={navigate} />
      <Navigation currentPage={page} onNavigate={navigate} lang={lang} setLang={setLang} theme={theme} />

      <main className="h-main" style={{
        paddingTop: 116, flex: 1,
        opacity: visible ? 1 : 0,
        transition: 'opacity 0.14s ease-out',
      }}>
        <div className="h-page-enter" key={page}>
          {pageMap[page] || pageMap['home']}
        </div>
      </main>

      <Footer onNavigate={navigate} theme={theme} />

      {/* ── Tweaks Panel ── */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Design Variation" />
        <TweakRadio
          label="Theme"
          value={tweaks.theme}
          options={[
            { label: 'A: Heritage', value: 'A' },
            { label: 'B: Modern', value: 'B' },
          ]}
          onChange={v => setTweak('theme', v)}
        />

        <TweakSection label="ER Status" />
        <TweakSelect
          label="응급실 모드"
          value={tweaks.erMode}
          options={[
            { label: '정상 (수용 가능)', value: 'normal' },
            { label: '혼잡 (접수 증가)', value: 'busy' },
            { label: '포화 (긴급)', value: 'critical' },
          ]}
          onChange={v => setTweak('erMode', v)}
        />

        <TweakSection label="빠른 페이지 이동" />
        <TweakButton label="홈" onClick={() => navigate('home')} />
        <TweakButton label="응급실 현황" onClick={() => navigate('er-status')} />
        <TweakButton label="온라인 예약" onClick={() => navigate('appointment')} />
        <TweakButton label="의료진 소개" onClick={() => navigate('medical-team')} />
        <TweakButton label="화상 치료 센터" onClick={() => navigate('burn-treatment')} />
        <TweakButton label="HBOT 센터" onClick={() => navigate('hbot')} />
        <TweakButton label="장비 소개" onClick={() => navigate('equipment')} />
        <TweakButton label="진료 철학" onClick={() => navigate('philosophy')} />
        <TweakButton label="오시는 길" onClick={() => navigate('directions')} />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</head>
<body>
  <div id="root"></div>
  <template id="__bundler_thumbnail" data-bg-color="#0A2540">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#0A2540"/>
      <text x="600" y="320" font-family="'Noto Serif KR', serif" font-size="96" font-weight="700" fill="white" text-anchor="middle">서해한결의료원</text>
      <text x="600" y="420" font-family="'Noto Sans KR', sans-serif" font-size="48" fill="#E8533A" text-anchor="middle">화상·외상 전문</text>
      <circle cx="1000" cy="400" r="200" fill="none" stroke="#E8533A" stroke-width="2" opacity="0.3"/>
    </svg>
  </template>
</body>
</html>
